<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balju Pay — 화면 명세</title>
  <style>
    /* ───────────────────────────────────────
       기본 리셋
    ─────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    html, body { height: 100%; }

    /* ───────────────────────────────────────
       3단 레이아웃 (좌 / 중 / 우)
       — 이 구조는 콘텐츠 교체 시에도 유지됨
    ─────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      grid-template-rows: 56px 1fr;
      grid-template-areas:
        "topbar topbar topbar"
        "sidebar  main  detail";
      height: 100vh;
      overflow: hidden;
    }

    /* ── 상단 바 ── */
    .topbar {
      grid-area: topbar;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-logo {
      width: 28px;
      height: 28px;
      background: #00c73c;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
    }

    .topbar h1 {
      font-size: 15px;
      font-weight: 700;
      color: #222;
    }

    .topbar-badge {
      margin-left: 6px;
      font-size: 11px;
      color: #888;
      background: #f2f2f2;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ── 좌측 인덱스 사이드바 ── */
    .sidebar {
      grid-area: sidebar;
      background: #fafafa;
      border-right: 1px solid #e8e8e8;
      overflow-y: auto;
      padding: 16px 0;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 18px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s, color 0.1s;
      text-decoration: none;
    }

    .nav-item:hover {
      background: #f0f0f0;
      color: #222;
    }

    .nav-item.active {
      background: #f0fff5;
      color: #00c73c;
      border-left-color: #00c73c;
      font-weight: 600;
    }

    .nav-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }

    .nav-item.active .nav-dot { background: #00c73c; }

    /* ── 중앙 화면 영역 ── */
    .main {
      grid-area: main;
      background: #f0f0f0;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    /* ── 우측 화면 설명 ── */
    .detail {
      grid-area: detail;
      background: #fff;
      border-left: 1px solid #e8e8e8;
      overflow-y: auto;
      padding: 24px 20px;
    }

    .detail-screen-name {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .detail h2 {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .detail-divider {
      height: 1px;
      background: #f0f0f0;
      margin: 16px 0;
    }

    .detail-section-label {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }

    .detail p {
      font-size: 13px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .detail ul {
      padding-left: 16px;
      margin-bottom: 10px;
    }

    .detail ul li {
      font-size: 13px;
      color: #555;
      line-height: 1.8;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      margin: 2px 2px 2px 0;
      font-weight: 600;
    }

    .tag-green  { background: #e8fef0; color: #00a832; }
    .tag-gray   { background: #f2f2f2; color: #666; }
    .tag-yellow { background: #fffbe6; color: #b07e00; }

    .state-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .state-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: #555;
      line-height: 1.5;
    }

    .state-bullet {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00c73c;
      margin-top: 5px;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════
       모달 컴포넌트 스타일
    ═══════════════════════════════════════ */
    .modal {
      background: #fff;
      border-radius: 16px;
      width: 560px;
      max-width: 100%;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.18);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 22px 24px 18px;
      border-bottom: 1px solid #f0f0f0;
    }

    .header-logo {
      width: 30px;
      height: 30px;
      background: #00c73c;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #222;
      flex: 1;
    }

    .btn-close {
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      font-size: 22px;
      line-height: 1;
      padding: 2px 6px;
    }
    .btn-close:hover { color: #444; }

    .modal-body {
      padding: 20px 24px 24px;
    }

    .amount-box {
      background: #f0fff5;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .amount-box .label {
      font-size: 15px;
      color: #444;
      font-weight: 500;
    }

    .amount-box .amount {
      font-size: 22px;
      font-weight: 800;
      color: #00c73c;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .option:hover  { border-color: #b0e8c0; }
    .option.selected { border-color: #00c73c; }

    .option-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .option.selected .radio {
      border-color: #00c73c;
      background: #00c73c;
    }

    .radio-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      display: none;
    }

    .option.selected .radio-dot { display: block; }

    .option-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .option-title {
      font-size: 15px;
      font-weight: 700;
      color: #222;
    }

    .option-title.green { color: #00c73c; }

    .option-desc {
      font-size: 13px;
      color: #888;
    }

    .card-selectors {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }

    .card-icon { color: #aaa; flex-shrink: 0; }
    .card-icon svg { display: block; }

    select {
      flex: 1;
      height: 42px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      color: #333;
      background: #fff;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%23999' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
    }

    select:focus { outline: none; border-color: #00c73c; }

    .select-installment { flex: 0 0 110px; }

    .modal-footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 4px 24px 26px;
    }

    .btn {
      height: 50px;
      min-width: 130px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-cancel {
      background: #f2f2f2;
      color: #555;
      border: 1px solid #ddd;
    }

    .btn-next {
      background: #00c73c;
      color: #fff;
    }

    /* ═══════════════════════════════════════
       결제수단 등록 화면 스타일
    ═══════════════════════════════════════ */
    .reg-modal {
      background: #fff;
      border-radius: 16px;
      width: 500px;
      max-width: 100%;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.18);
    }

    .reg-modal-header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 22px 24px 18px;
      border-bottom: 1px solid #f0f0f0;
    }

    .reg-modal-header h2 {
      font-size: 17px;
      font-weight: 700;
      color: #222;
    }

    .reg-modal-header .btn-close {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
    }

    .reg-modal-body {
      padding: 22px 24px 10px;
    }

    .reg-section-title {
      font-size: 14px;
      font-weight: 700;
      color: #222;
      margin-bottom: 14px;
    }

    .reg-section-title .hint {
      font-size: 12px;
      font-weight: 400;
      color: #888;
      margin-left: 4px;
    }

    .reg-field {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 14px 11px;
      margin-bottom: 8px;
    }

    .reg-field label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 5px;
    }

    .reg-field input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: #333;
      background: transparent;
      padding: 0;
    }

    .reg-field input::placeholder { color: #bbb; }

    .card-num-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-num-row .card-seg {
      flex: 1;
      text-align: center;
    }

    .card-dash {
      color: #bbb;
      font-size: 16px;
      flex-shrink: 0;
    }

    .reg-field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 0;
    }

    .reg-field-row .reg-field {
      margin-bottom: 8px;
    }

    .reg-modal-footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px 26px;
    }

    /* ── 서비스 이용료 안내 박스 ── */
    .fee-notice {
      display: none;
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 14px;
    }

    .fee-notice.visible { display: block; }

    .fee-notice-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #b07e00;
      margin-bottom: 10px;
    }

    .fee-notice-rows {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .fee-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #555;
    }

    .fee-row.total {
      border-top: 1px solid #ffe58f;
      margin-top: 6px;
      padding-top: 8px;
      font-weight: 700;
      color: #222;
    }

    .fee-row .fee-value { color: #555; }
    .fee-row.total .fee-value { color: #b07e00; }
  </style>
</head>
<body>
<div class="layout">

  <!-- ── 상단 바 ── -->
  <header class="topbar">
    <div class="topbar-logo">P</div>
    <h1>Balju Pay</h1>
    <span class="topbar-badge">화면 명세서</span>
  </header>

  <!-- ── 좌측: 인덱스 ── -->
  <nav class="sidebar">
    <a class="nav-item active" href="#" data-screen="screen-pay-method" data-title="결제 방식 선택">
      <span class="nav-dot"></span>결제 방식 선택
    </a>
    <a class="nav-item" href="#" data-screen="screen-card-register" data-title="결제 수단 등록">
      <span class="nav-dot"></span>결제 수단 등록
    </a>
  </nav>

  <!-- ── 중앙: 화면 영역 ── -->
  <main class="main" id="screen-area">

    <!-- ── 결제 방식 선택 화면 ── -->
    <div id="screen-pay-method">
    <div class="modal" id="pay-method">

      <!-- 헤더 -->
      <div class="modal-header">
        <div class="header-logo">P</div>
        <h2>결제 방식 선택</h2>
        <button class="btn-close">×</button>
      </div>

      <!-- 본문 -->
      <div class="modal-body">

        <div class="options">

          <!-- 예치금 결제 -->
          <div class="option" id="opt-deposit" onclick="selectOption('deposit')">
            <div class="option-row">
              <div class="radio"><div class="radio-dot"></div></div>
              <div class="option-text">
                <span class="option-title">예치금 결제</span>
                <span class="option-desc">결제 후 잔액 1,250,900원</span>
              </div>
            </div>
          </div>

          <!-- 신용카드 결제 (기본 선택) -->
          <div class="option selected" id="opt-credit" onclick="selectOption('credit')">
            <div class="option-row">
              <div class="radio"><div class="radio-dot"></div></div>
              <div class="option-text">
                <span class="option-title">신용카드 결제</span>
                <span class="option-desc">카드 정보를 직접 입력해 결제</span>
              </div>
            </div>
          </div>

          <!-- 등록된 카드로 결제 -->
          <div class="option" id="opt-saved" onclick="selectOption('saved')">
            <div class="option-row">
              <div class="radio"><div class="radio-dot"></div></div>
              <div class="option-text">
                <span class="option-title green">등록된 카드로 결제</span>
                <span class="option-desc">간편 비밀번호로 빠르게 결제</span>
              </div>
            </div>
            <div class="card-selectors">
              <div class="card-icon">
                <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="1" y="1" width="20" height="14" rx="3" stroke="#aaa" stroke-width="1.5"/>
                  <rect x="1" y="4.5" width="20" height="3" fill="#ccc"/>
                </svg>
              </div>
              <select id="card-select">
                <option>KB국민카드 **** 1234</option>
                <option>신한카드 **** 5678</option>
                <option>우리카드 **** 9012</option>
              </select>
              <select id="installment-select" class="select-installment">
                <option>3개월</option>
                <option>일시불</option>
                <option>2개월</option>
                <option>6개월</option>
                <option>12개월</option>
              </select>
            </div>
          </div>

        </div>

        <!-- 서비스 이용료 안내 박스 -->
        <div class="fee-notice" id="fee-notice">
          <div class="fee-notice-header">
            <span>⚠</span>
            <span>신용카드 결제 시 서비스 이용료 3%가 추가됩니다.</span>
          </div>
          <div class="fee-notice-rows">
            <div class="fee-row">
              <span>결제금액</span>
              <span class="fee-value" id="fee-base"></span>
            </div>
            <div class="fee-row">
              <span>서비스 이용료 (3%)</span>
              <span class="fee-value" id="fee-charge"></span>
            </div>
            <div class="fee-row total">
              <span>최종 결제금액</span>
              <span class="fee-value" id="fee-total"></span>
            </div>
          </div>
        </div>

        <div class="amount-box" style="margin-top:14px; margin-bottom:0;">
          <span class="label">총 결제금액</span>
          <span class="amount" id="display-amount">1,250,000원</span>
        </div>

      </div>

      <!-- 푸터 -->
      <div class="modal-footer">
        <button class="btn btn-cancel">취소</button>
        <button class="btn btn-next" onclick="goNext()">다음</button>
      </div>

    </div>
    </div><!-- /screen-pay-method -->

    <!-- ── 결제수단 등록 화면 ── -->
    <div id="screen-card-register" style="display:none">
    <div class="reg-modal">

      <div class="reg-modal-header">
        <h2>결제수단 등록</h2>
        <button class="btn-close">x</button>
      </div>

      <div class="reg-modal-body">

        <div class="reg-section-title">
          카드 정보 입력 <span class="hint">(최초 1회만)</span>
        </div>

        <!-- 카드번호 -->
        <div class="reg-field">
          <label>카드번호</label>
          <div class="card-num-row">
            <input type="text" class="card-seg" maxlength="4" inputmode="numeric">
            <span class="card-dash">-</span>
            <input type="text" class="card-seg" maxlength="4" inputmode="numeric">
            <span class="card-dash">-</span>
            <input type="text" class="card-seg" maxlength="4" inputmode="numeric">
            <span class="card-dash">-</span>
            <input type="text" class="card-seg" maxlength="4" inputmode="numeric">
          </div>
        </div>

        <!-- 유효기간 -->
        <div class="reg-field-row">
          <div class="reg-field">
            <label>유효기간 (MM)</label>
            <input type="text" maxlength="2" placeholder="* *" inputmode="numeric">
          </div>
          <div class="reg-field">
            <label>유효기간 (YY)</label>
            <input type="text" maxlength="2" placeholder="* *" inputmode="numeric">
          </div>
        </div>

        <!-- 비밀번호 -->
        <div class="reg-field">
          <label>비밀번호</label>
          <input type="password" maxlength="2" placeholder="* *" inputmode="numeric">
        </div>

        <!-- 식별정보 -->
        <div class="reg-field">
          <label>식별정보</label>
          <input type="text" maxlength="10" placeholder="주민번호 앞 6자리 또는 사업자번호(법인)">
        </div>

        <!-- 이메일(선택) -->
        <div class="reg-field">
          <label>이메일(선택)</label>
          <input type="email" placeholder="">
        </div>

      </div>

      <div class="reg-modal-footer">
        <button class="btn btn-cancel">취소</button>
        <button class="btn btn-next">등록</button>
      </div>

    </div>
    </div><!-- /screen-card-register -->

  </main>

  <!-- ── 우측: 화면 설명 ── -->
  <aside class="detail">
    <h2 id="detail-screen-name">결제 방식 선택</h2>
  </aside>

</div>

<script>
  const BASE_AMOUNT = 1250000;

  function fmt(n) {
    return n.toLocaleString('ko-KR') + '원';
  }

  function updateFeeNotice(type) {
    const notice = document.getElementById('fee-notice');
    const showFee = type === 'credit' || type === 'saved';
    notice.classList.toggle('visible', showFee);

    const fee = Math.round(BASE_AMOUNT * 0.03);
    if (showFee) {
      document.getElementById('fee-base').textContent   = fmt(BASE_AMOUNT);
      document.getElementById('fee-charge').textContent = '+' + fmt(fee);
      document.getElementById('fee-total').textContent  = fmt(BASE_AMOUNT + fee);
      document.getElementById('display-amount').textContent = fmt(BASE_AMOUNT + fee);
    } else {
      document.getElementById('display-amount').textContent = fmt(BASE_AMOUNT);
    }
  }

  function selectOption(type) {
    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    const map = { deposit: 'opt-deposit', credit: 'opt-credit', saved: 'opt-saved' };
    document.getElementById(map[type]).classList.add('selected');
    updateFeeNotice(type);
  }

  updateFeeNotice('credit');

  function goNext() {
    alert('다음 단계로 이동합니다.');
  }

  // 화면 전환
  function showScreen(screenId, title) {
    document.querySelectorAll('#screen-area > div[id^="screen-"]').forEach(s => {
      s.style.display = 'none';
    });
    const target = document.getElementById(screenId);
    if (target) target.style.display = '';
    if (title) document.getElementById('detail-screen-name').textContent = title;
  }

  // 좌측 내비 활성화 + 화면 전환
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', function (e) {
      e.preventDefault();
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      this.classList.add('active');
      const screen = this.dataset.screen;
      const title  = this.dataset.title;
      if (screen) showScreen(screen, title);
    });
  });
</script>
</body>
</html>
