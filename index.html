<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 방식 선택</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo',
        'Noto Sans KR', sans-serif;
    }

    body {
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* 모달 오버레이 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 모달 본체 */
    .modal {
      background: #fff;
      border-radius: 16px;
      width: 560px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    }

    /* 헤더 */
    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 22px 24px 18px;
      border-bottom: 1px solid #f0f0f0;
    }

    .header-logo {
      width: 30px;
      height: 30px;
      background: #00c73c;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #222;
      flex: 1;
    }

    .btn-close {
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      font-size: 22px;
      line-height: 1;
      padding: 2px 4px;
    }
    .btn-close:hover { color: #555; }

    /* 본문 */
    .modal-body {
      padding: 20px 24px 24px;
    }

    /* 총 결제금액 */
    .amount-box {
      background: #f0fff5;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .amount-box .label {
      font-size: 15px;
      color: #444;
      font-weight: 500;
    }

    .amount-box .amount {
      font-size: 22px;
      font-weight: 800;
      color: #00c73c;
    }

    /* 결제 옵션 목록 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 각 옵션 행 */
    .option {
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .option:hover {
      border-color: #b0e8c0;
    }

    .option.selected {
      border-color: #00c73c;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 라디오 버튼 커스텀 */
    .radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .option.selected .radio {
      border-color: #00c73c;
      background: #00c73c;
    }

    .radio-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      display: none;
    }

    .option.selected .radio-dot {
      display: block;
    }

    .option-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .option-title {
      font-size: 15px;
      font-weight: 700;
      color: #222;
    }

    .option-desc {
      font-size: 13px;
      color: #888;
    }

    /* 등록된 카드로 결제 타이틀 색상 */
    .option-title.green {
      color: #00c73c;
    }

    /* 카드 선택 드롭다운 영역 */
    .card-selectors {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }

    .card-icon {
      color: #aaa;
      flex-shrink: 0;
    }

    .card-icon svg {
      display: block;
    }

    select {
      flex: 1;
      height: 42px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      color: #333;
      background: #fff;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%23999' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: #00c73c;
    }

    .select-installment {
      flex: 0 0 110px;
    }

    /* 하단 버튼 */
    .modal-footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 4px 24px 26px;
    }

    .btn {
      height: 50px;
      min-width: 130px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-cancel {
      background: #f2f2f2;
      color: #555;
      border: 1px solid #ddd;
    }

    .btn-next {
      background: #00c73c;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="modal">

      <!-- 헤더 -->
      <div class="modal-header">
        <div class="header-logo">P</div>
        <h2>결제 방식 선택</h2>
        <button class="btn-close" onclick="closeModal()">×</button>
      </div>

      <!-- 본문 -->
      <div class="modal-body">

        <!-- 총 결제금액 -->
        <div class="amount-box">
          <span class="label">총 결제금액</span>
          <span class="amount">1,250,000원</span>
        </div>

        <!-- 결제 옵션 -->
        <div class="options">

          <!-- 예치금 결제 -->
          <div class="option" id="opt-deposit" onclick="selectOption('deposit')">
            <div class="option-row">
              <div class="radio"><div class="radio-dot"></div></div>
              <div class="option-text">
                <span class="option-title">예치금 결제</span>
                <span class="option-desc">결제 후 잔액 1,250,900원</span>
              </div>
            </div>
          </div>

          <!-- 신용카드 결제 (기본 선택) -->
          <div class="option selected" id="opt-credit" onclick="selectOption('credit')">
            <div class="option-row">
              <div class="radio"><div class="radio-dot"></div></div>
              <div class="option-text">
                <span class="option-title">신용카드 결제</span>
                <span class="option-desc">카드 정보를 직접 입력해 결제</span>
              </div>
            </div>
          </div>

          <!-- 등록된 카드로 결제 -->
          <div class="option" id="opt-saved" onclick="selectOption('saved')">
            <div class="option-row">
              <div class="radio"><div class="radio-dot"></div></div>
              <div class="option-text">
                <span class="option-title green">등록된 카드로 결제</span>
                <span class="option-desc">간편 비밀번호로 빠르게 결제</span>
              </div>
            </div>

            <!-- 카드 선택 드롭다운 -->
            <div class="card-selectors">
              <div class="card-icon">
                <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="1" y="1" width="20" height="14" rx="3" stroke="#aaa" stroke-width="1.5"/>
                  <rect x="1" y="4.5" width="20" height="3" fill="#ccc"/>
                </svg>
              </div>
              <select id="card-select">
                <option>KB국민카드 **** 1234</option>
                <option>신한카드 **** 5678</option>
                <option>우리카드 **** 9012</option>
              </select>
              <select id="installment-select" class="select-installment">
                <option>3개월</option>
                <option>일시불</option>
                <option>2개월</option>
                <option>6개월</option>
                <option>12개월</option>
              </select>
            </div>
          </div>

        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn btn-next" onclick="goNext()">다음</button>
      </div>

    </div>
  </div>

  <script>
    function selectOption(type) {
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      const map = { deposit: 'opt-deposit', credit: 'opt-credit', saved: 'opt-saved' };
      document.getElementById(map[type]).classList.add('selected');
    }

    function closeModal() {
      document.querySelector('.overlay').style.display = 'none';
    }

    function goNext() {
      const selected = document.querySelector('.option.selected');
      if (selected) {
        alert('다음 단계로 이동합니다.');
      }
    }
  </script>
</body>
</html>
